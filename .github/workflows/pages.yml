name: Test and publish Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      # No npm install: this version has zero package dependencies.
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # These packages are only test tools; the website has no runtime dependencies.
      - run: python -m pip install playwright==1.57.0 psd-tools==1.19.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser workspace and persistent project tests
        run: python scripts/browser-workspace.py
      - name: Alignment, selection and snapping UI regression
        run: python scripts/browser-precision.py
      - name: Bezier controls and trace Worker regression
        run: python scripts/browser-trace-curves.py
      - name: Independent PSD format check
        run: python scripts/verify-psd.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-artifacts
          path: artifacts
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
